name: Interacción del bot

on:
  # El schedule de GitHub Actions no es confiable para intervalos cortos
  # (en la práctica corre cada varias horas, no cada 5 min). El disparo real
  # viene de un Cron Trigger de Cloudflare Workers que llama a la API de
  # "workflow_dispatch" cada 5 minutos. Ver cloudflare-worker/.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Procesar comandos entrantes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Guardar cambios (offset, keywords, seen_urls)
        run: |
          git config user.name "tucuman-news-monitor bot"
          git config user.email "actions@github.com"
          git add bot_offset.json keywords.yaml seen_urls.json
          git diff --cached --quiet && exit 0
          git commit -m "Bot: procesar comandos entrantes"
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rechazado, reintentando con rebase ($i/5)..."
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 1))
          done
          exit 1
