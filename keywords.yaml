# Palabras clave a monitorear. Editar esta lista para ajustar qué se rastrea.
# El matching es case-insensitive y no distingue acentos (ej. "tucuman"
# matchea "Tucumán").
#
# El informe no lista todo lo que matchea: evalúa relevancia (más keywords
# matcheadas = más relevante), descarta noticias repetidas cubiertas por
# varios medios y se queda solo con las `max_results` más importantes.
max_results: 10

keywords:
  - San Miguel de Tucumán
  - municipalidad de Tucumán
  - Rossana Chahla
  - accidente
  - incendio
  - alerta climatológica
  - eventos
  - prevención
  - emergencia
  - Defensa Civil

# Artículos que matchean alguna keyword de arriba pero también mencionan
# algo de esta lista se descartan igual (ej. notas de deportes que
# mencionan "Tucumán" o "accidente" en un contexto deportivo).
exclude_keywords:
  - fútbol
  - futbolista
  - gol
  - goles
  - partido
  - liga tucumana
  - torneo
  - campeonato
  - hincha
  - hinchada
  - club atlético
  - San Martín de Tucumán
  - Atlético Tucumán
  - Boca Juniors
  - River Plate
  - básquet
  - rugby
  - hipódromo
  - automovilismo
